AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding Config Runtime Read Lambda - SAM Template

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [test, prod, production]
    Description: Deployment environment name used for tags and environment-specific stack configuration.
  ConfigTableName:
    Type: String
    Default: zoolanding-config-registry
    Description: DynamoDB table that stores site routing, lifecycle, and version metadata.
  ConfigPayloadsBucketName:
    Type: String
    Default: zoolanding-config-payloads
    Description: S3 bucket that stores versioned site payloads.
  ContentHubMetadataTableName:
    Type: String
    Default: ''
    Description: Optional content-hub metadata table used to project published public article indexes.
  ContentHubMetadataTableNameTest:
    Type: String
    Default: ''
    Description: Optional test content-hub metadata table used when environment=test.
  ContentHubMetadataTableNameProd:
    Type: String
    Default: ''
    Description: Optional production content-hub metadata table used when environment=prod or production.
  ContentHubPackagesBucketName:
    Type: String
    Default: ''
    Description: Optional content-hub package bucket used to read published public article bundles.
  ContentHubPackagesBucketNameTest:
    Type: String
    Default: ''
    Description: Optional test content-hub package bucket used when environment=test.
  ContentHubPackagesBucketNameProd:
    Type: String
    Default: ''
    Description: Optional production content-hub package bucket used when environment=prod or production.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Log level for the Lambda.
  RuntimeExecutionBoundaryArn:
    Type: String
    Description: Retained permissions boundary owned by the Zoolanding infrastructure repository.

Conditions:
  HasContentHubMetadataTable:
    Fn::Not:
      - Fn::Equals:
          - Ref: ContentHubMetadataTableName
          - ''
  HasContentHubMetadataTableTest:
    Fn::Not:
      - Fn::Equals:
          - Ref: ContentHubMetadataTableNameTest
          - ''
  HasContentHubMetadataTableProd:
    Fn::Not:
      - Fn::Equals:
          - Ref: ContentHubMetadataTableNameProd
          - ''
  HasContentHubPackagesBucket:
    Fn::Not:
      - Fn::Equals:
          - Ref: ContentHubPackagesBucketName
          - ''
  HasContentHubPackagesBucketTest:
    Fn::Not:
      - Fn::Equals:
          - Ref: ContentHubPackagesBucketNameTest
          - ''
  HasContentHubPackagesBucketProd:
    Fn::Not:
      - Fn::Equals:
          - Ref: ContentHubPackagesBucketNameProd
          - ''

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Tracing: PassThrough
    Tags:
      Project: Zoolandingpage
      Component: RuntimeFrontDoor
      ManagedBy: SAM
      Environment:
        Ref: EnvironmentName

Resources:
  RuntimeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      MethodSettings:
        - HttpMethod: GET
          ResourcePath: /~1runtime-bundle
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
      Tags:
        Project: Zoolandingpage
        Component: RuntimeFrontDoor
        ManagedBy: SAM
        Environment:
          Ref: EnvironmentName
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,OPTIONS'"

  ConfigRuntimeReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/runtime-read
      Handler: lambda_function.lambda_handler
      Description: Resolves the current site by domain and route and returns one effective runtime bundle.
      PermissionsBoundary:
        Ref: RuntimeExecutionBoundaryArn
      ReservedConcurrentExecutions: 100
      Environment:
        Variables:
          CONFIG_TABLE_NAME:
            Ref: ConfigTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          CONTENT_HUB_METADATA_TABLE_NAME:
            Ref: ContentHubMetadataTableName
          CONTENT_HUB_METADATA_TABLE_NAME_TEST:
            Ref: ContentHubMetadataTableNameTest
          CONTENT_HUB_METADATA_TABLE_NAME_PROD:
            Ref: ContentHubMetadataTableNameProd
          CONTENT_HUB_PACKAGES_BUCKET_NAME:
            Ref: ContentHubPackagesBucketName
          CONTENT_HUB_PACKAGES_BUCKET_NAME_TEST:
            Ref: ContentHubPackagesBucketNameTest
          CONTENT_HUB_PACKAGES_BUCKET_NAME_PROD:
            Ref: ContentHubPackagesBucketNameProd
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
          LOG_LEVEL:
            Ref: LogLevel
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigTableName}
            - Fn::If:
                - HasContentHubMetadataTable
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:Query
                  Resource:
                    Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContentHubMetadataTableName}
                - Ref: AWS::NoValue
            - Fn::If:
                - HasContentHubMetadataTableTest
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:Query
                  Resource:
                    Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContentHubMetadataTableNameTest}
                - Ref: AWS::NoValue
            - Fn::If:
                - HasContentHubMetadataTableProd
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:Query
                  Resource:
                    Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContentHubMetadataTableNameProd}
                - Ref: AWS::NoValue
            - Sid: DenyServerOnlyDraftDescriptors
              Effect: Deny
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:aws:s3:::${ConfigPayloadsBucketName}/*/server/*
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:aws:s3:::${ConfigPayloadsBucketName}/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                Fn::Sub: arn:aws:s3:::${ConfigPayloadsBucketName}
            - Fn::If:
                - HasContentHubPackagesBucket
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource:
                    Fn::Sub: arn:aws:s3:::${ContentHubPackagesBucketName}/content-hubs/*
                - Ref: AWS::NoValue
            - Fn::If:
                - HasContentHubPackagesBucketTest
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource:
                    Fn::Sub: arn:aws:s3:::${ContentHubPackagesBucketNameTest}/content-hubs/*
                - Ref: AWS::NoValue
            - Fn::If:
                - HasContentHubPackagesBucketProd
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource:
                    Fn::Sub: arn:aws:s3:::${ContentHubPackagesBucketNameProd}/content-hubs/*
                - Ref: AWS::NoValue
      Events:
        RuntimeBundleGet:
          Type: Api
          Properties:
            RestApiId:
              Ref: RuntimeApi
            Path: /runtime-bundle
            Method: GET

Outputs:
  ApiUrl:
    Description: Runtime bundle endpoint URL.
    Value:
      Fn::Sub: https://${RuntimeApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/runtime-bundle
  FunctionName:
    Description: Deployed Lambda function name.
    Value:
      Ref: ConfigRuntimeReadFunction
