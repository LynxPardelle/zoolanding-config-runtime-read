name: Deploy Test

on:
  workflow_dispatch:
  push:
    branches: [test]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: runtime-read-test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify protected target branch
        shell: bash
        env:
          CURRENT_REF: ${{ github.ref }}
          TARGET_REF: refs/heads/test
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REF" != "$TARGET_REF" ]]; then
            echo "Test deploys must run from $TARGET_REF."
            exit 1
          fi

      - name: Verify exact dev-to-test merged PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-promotion-commit.mjs --source=dev --target=test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: aws-actions/setup-sam@v3

      - name: Validate candidate
        env:
          LOG_LEVEL: ERROR
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          sam validate --lint
          sam build --no-cached

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: test
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validated commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: aws-actions/setup-sam@v3

      - name: Rebuild validated commit
        env:
          LOG_LEVEL: ERROR
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          sam validate --lint
          sam build --no-cached

      - name: Reverify exact dev-to-test merged PR after rebuild
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-promotion-commit.mjs --source=dev --target=test

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy test
        run: sam deploy --config-env test --no-confirm-changeset --no-fail-on-empty-changeset
