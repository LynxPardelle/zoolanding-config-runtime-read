name: Deploy Test

on:
  workflow_dispatch:
    inputs:
      execution:
        type: choice
        options: [review, execute]
        default: review
        required: true
      review_digest:
        type: string
        required: false
      review_change_set_arn:
        type: string
        required: false
  push:
    branches: [test]

permissions:
  contents: read
  pull-requests: read

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  SAM_CLI_TELEMETRY: 0

concurrency:
  group: runtime-read-test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.artifact_metadata.outputs.artifact_name }}
      manifest_digest: ${{ steps.artifact_metadata.outputs.manifest_digest }}
      source_only: ${{ steps.release_mode.outputs.source_only }}
      operator_digest: ${{ steps.artifact_metadata.outputs.operator_digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Verify protected target branch
        shell: bash
        env:
          CURRENT_REF: ${{ github.ref }}
          TARGET_REF: refs/heads/test
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REF" != "$TARGET_REF" ]]; then
            echo "Test deploys must run from $TARGET_REF."
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Separate code promotion from activation
        id: release_mode
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SELECTION_JSON: ${{ vars.RUNTIME_TEST_PROMOTION_SELECTION_JSON }}
          ACTIVATION_SELECTION_JSON: ${{ vars.RUNTIME_TEST_ACTIVATION_SELECTION_JSON }}
        run: python tools/verify_source_only_promotion.py --target=test

      - name: Verify exact dev-to-test merged PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-promotion-commit.mjs --source=dev --target=test

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}

      - name: Validate candidate
        env:
          LOG_LEVEL: ERROR
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"

      - name: Restore exact revision for packaging
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Build deployment artifact
        run: |
          set -euo pipefail
          python tools/build_lambda_artifact.py
          sam validate --lint
          sam build --no-cached
          python tools/build_lambda_artifact.py --verify-artifact .aws-sam/build/ConfigRuntimeReadFunction
          python tools/build_lambda_artifact.py --package-test-release .aws-sam/build/ConfigRuntimeReadFunction --sam-template .aws-sam/build/template.yaml
          sam validate --lint --template-file .aws-sam/release/template.yaml

      - name: Write validated build manifest
        id: artifact_metadata
        shell: bash
        run: |
          set -euo pipefail
          (cd .aws-sam/release && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > .aws-sam/release-manifest.sha256
          artifact_name="runtime-read-test-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          manifest_digest="$(sha256sum .aws-sam/release-manifest.sha256 | cut -d ' ' -f1)"
          [[ "$artifact_name" =~ ^runtime-read-test-build-[1-9][0-9]*-[1-9][0-9]*-[a-f0-9]{40}$ ]]
          [[ "$manifest_digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'artifact_name=%s\nmanifest_digest=%s\n' "$artifact_name" "$manifest_digest" >> "$GITHUB_OUTPUT"
          cp tools/native_runtime_release.py .aws-sam/native-runtime-release.py
          operator_digest="$(sha256sum .aws-sam/native-runtime-release.py | cut -d ' ' -f1)"
          printf 'operator_digest=%s\n' "$operator_digest" >> "$GITHUB_OUTPUT"

      - name: Upload exact validated artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_metadata.outputs.artifact_name }}
          path: |
            .aws-sam/release/template.yaml
            .aws-sam/release/runtime-read.zip
            .aws-sam/release/lambda-code-sha256.txt
            .aws-sam/release-manifest.sha256
            .aws-sam/native-runtime-release.py
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Reverify exact dev-to-test merged PR after artifact creation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-promotion-commit.mjs --source=dev --target=test

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.source_only != 'true'
    environment: test
    env:
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      EXECUTION: ${{ inputs.execution }}
      REVIEW_DIGEST: ${{ inputs.review_digest }}
      REVIEW_CHANGE_SET_ARN: ${{ inputs.review_change_set_arn }}
      OPERATOR_DIGEST: ${{ needs.validate.outputs.operator_digest }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Validate artifact metadata
        id: validate_artifact_metadata
        shell: bash
        env:
          RAW_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          RAW_ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          RAW_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact_id="$RAW_ARTIFACT_ID"
          artifact_name="$RAW_ARTIFACT_NAME"
          manifest_digest="$RAW_MANIFEST_DIGEST"
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_id" != *","* ]]
          [[ "$artifact_name" =~ ^runtime-read-test-build-[1-9][0-9]*-[1-9][0-9]*-${EXPECTED_SHA}$ ]]
          [[ "$manifest_digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'artifact_id=%s\nartifact_name=%s\nmanifest_digest=%s\n' \
            "$artifact_id" "$artifact_name" "$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Download validated artifact from this workflow run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.validate_artifact_metadata.outputs.artifact_id }}
          path: .aws-sam
          merge-multiple: true

      - name: Verify validated build artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.validate_artifact_metadata.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.validate_artifact_metadata.outputs.artifact_name }}
          EXPECTED_MANIFEST_DIGEST: ${{ steps.validate_artifact_metadata.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_NAME" =~ ^runtime-read-test-build-[1-9][0-9]*-[1-9][0-9]*-[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_MANIFEST_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test -f .aws-sam/release/template.yaml
          test -f .aws-sam/release/runtime-read.zip
          test -f .aws-sam/release/lambda-code-sha256.txt
          test -f .aws-sam/release-manifest.sha256
          actual_manifest_digest="$(sha256sum .aws-sam/release-manifest.sha256 | cut -d ' ' -f1)"
          test "$actual_manifest_digest" = "$EXPECTED_MANIFEST_DIGEST"
          (cd .aws-sam/release && sha256sum --check --strict ../release-manifest.sha256)
          cut -c67- .aws-sam/release-manifest.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/manifest-paths.txt"
          (cd .aws-sam/release && LC_ALL=C find . -type f -print | LC_ALL=C sort) > "$RUNNER_TEMP/artifact-paths.txt"
          diff -u "$RUNNER_TEMP/manifest-paths.txt" "$RUNNER_TEMP/artifact-paths.txt"
          expected_code_sha256="$(tr -d '\r\n' < .aws-sam/release/lambda-code-sha256.txt)"
          [[ "$expected_code_sha256" =~ ^[A-Za-z0-9+/]{43}=$ ]]
          actual_code_sha256="$(openssl dgst -sha256 -binary .aws-sam/release/runtime-read.zip | openssl base64 -A)"
          test "$actual_code_sha256" = "$expected_code_sha256"
          test "$(grep -Fc 'CodeUri: runtime-read.zip' .aws-sam/release/template.yaml)" -eq 1
          [[ "$OPERATOR_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$(sha256sum .aws-sam/native-runtime-release.py | cut -d ' ' -f1)" = "$OPERATOR_DIGEST"

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}

      - name: Validate deployment role configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_CLOUDFORMATION_ROLE_ARN" = "arn:aws:iam::765932874577:role/zoolanding-config-runtime-read-test-cfn-exec"

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_BRANCH: dev
          TARGET_BRANCH: test
          ACTIVATION_SELECTION_JSON: ${{ vars.RUNTIME_TEST_ACTIVATION_SELECTION_JSON }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fail = code => { throw new Error(code); };
            const isSha = value => /^[a-f0-9]{40}$/.test(value ?? '');
            const repository = process.env.GITHUB_REPOSITORY;
            const sha = process.env.EXPECTED_SHA;
            const sourceBranch = process.env.SOURCE_BRANCH;
            const targetBranch = process.env.TARGET_BRANCH;
            if (!repository || !isSha(sha) || process.env.GITHUB_REF !== `refs/heads/${targetBranch}`) {
              fail('promotion_context_invalid');
            }
            const [owner, repo] = repository.split('/');
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: sha });
            const parents = Array.isArray(commit.parents) ? commit.parents.map(parent => parent.sha) : [];
            if (parents.length !== 2 || parents.some(parent => !isSha(parent))) {
              fail('promotion_merge_commit_required');
            }
            let pullRequests = [];
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const response = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
                owner,
                repo,
                commit_sha: sha,
                per_page: 100,
                headers: { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' },
              });
              pullRequests = response.data;
              if (!Array.isArray(pullRequests) || pullRequests.length > 100) fail('promotion_api_invalid_response');
              if (pullRequests.length > 0 || attempt === 3) break;
              await new Promise(resolve => setTimeout(resolve, 1500));
            }
            const matches = pullRequests.filter(pullRequest => (
              pullRequest?.state === 'closed'
              && typeof pullRequest.merged_at === 'string'
              && pullRequest.merged_at.length > 0
              && (pullRequest.merge_commit_sha == null || pullRequest.merge_commit_sha === sha)
              && pullRequest.base?.ref === targetBranch
              && pullRequest.base?.repo?.full_name === repository
              && isSha(pullRequest.base?.sha)
              && pullRequest.head?.ref === sourceBranch
              && pullRequest.head?.repo?.full_name === repository
              && isSha(pullRequest.head?.sha)
            ));
            if (matches.length !== 1) fail(matches.length === 0 ? 'promotion_pr_not_found' : 'promotion_pr_ambiguous');
            const pullRequest = matches[0];
            if (parents[0] !== pullRequest.base.sha) fail('promotion_first_parent_mismatch');
            if (parents[1] !== pullRequest.head.sha) fail('promotion_second_parent_mismatch');
            if (context.eventName === 'push') {
              const event = context.payload;
              if (event.forced === true || event.created === true || event.deleted === true
                || event.after !== sha || !isSha(event.before) || /^0+$/.test(event.before)
                || parents[0] !== event.before) {
                fail('promotion_push_not_allowed');
              }
            } else if (context.eventName !== 'workflow_dispatch') {
              fail('promotion_event_not_allowed');
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: targetBranch });
            if (branch.commit.sha !== sha) fail('promotion_target_tip_mismatch');
            core.info('promotion_provenance_verified');
            if (context.eventName === 'workflow_dispatch') {
            const activationFail = () => { throw new Error('activation_selection_rejected'); };
            const selection = JSON.parse(require('node:child_process').execFileSync('python3', ['-c', 'import json,os;from tools.verify_source_only_promotion import parse_selection;print(json.dumps(parse_selection(os.getenv("ACTIVATION_SELECTION_JSON","null"))))'], {encoding:'utf8'}));
            if (context.eventName !== 'workflow_dispatch' || !['review','execute'].includes(process.env.EXECUTION)
              || (process.env.EXECUTION === 'review' && (process.env.REVIEW_DIGEST || process.env.REVIEW_CHANGE_SET_ARN))
              || (process.env.EXECUTION === 'execute' && (!/^[a-f0-9]{64}$/.test(process.env.REVIEW_DIGEST ?? '') || !/^arn:aws:cloudformation:us-east-1:765932874577:changeSet\/thn-runtime-[1-9][0-9]*-[1-9][0-9]*\/[a-f0-9-]+$/.test(process.env.REVIEW_CHANGE_SET_ARN ?? '')))
              || !selection || Object.keys(selection).sort().join(',') !== 'mode,schemaVersion,sha,tree,workflowSha256'
              || selection.schemaVersion !== 1 || selection.mode !== 'thn-reviewed-activation' || selection.sha !== context.sha || selection.tree !== commit.tree.sha) activationFail();
            const {data:activeWorkflow}=await github.rest.repos.getContent({owner,repo,path:'.github/workflows/deploy-test.yml',ref:context.sha});
            if (activeWorkflow.encoding !== 'base64' || require('node:crypto').createHash('sha256').update(Buffer.from(activeWorkflow.content,'base64').toString('utf8').replace(/\r\n/g,'\n')).digest('hex') !== selection.workflowSha256) activationFail();


            }
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy test
        env:
          SEALED_MANIFEST_DIGEST: ${{ steps.validate_artifact_metadata.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          sam deploy \
            --template-file .aws-sam/release/template.yaml \
            --stack-name zoolanding-config-runtime-read-test \
            --region us-east-1 \
            --resolve-s3 \
            --s3-prefix zoolanding-config-runtime-read-test \
            --capabilities CAPABILITY_IAM \
            --role-arn "$AWS_CLOUDFORMATION_ROLE_ARN" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "EnvironmentName=test" \
              "ConfigTableName=zoolanding-config-registry-test" \
              "ConfigPayloadsBucketName=zoolanding-config-payloads-test" \
              "ContentHubMetadataTableName=zoolanding-content-hub-test-ContentHubMetadataTable-ZV7P652CS11F" \
              "ContentHubMetadataTableNameTest=zoolanding-content-hub-test-ContentHubMetadataTable-ZV7P652CS11F" \
              "ContentHubMetadataTableNameProd=zoolanding-content-hub-prod-ContentHubMetadataTable-IQ1WMU24XMPB" \
              "ContentHubPackagesBucketName=zoolanding-content-hub-te-contenthubpackagesbucket-gdgtasj0yb0o" \
              "ContentHubPackagesBucketNameTest=zoolanding-content-hub-te-contenthubpackagesbucket-gdgtasj0yb0o" \
              "ContentHubPackagesBucketNameProd=zoolanding-content-hub-pr-contenthubpackagesbucket-ujejm7mr5unu" \
              "RuntimeExecutionBoundaryArn=arn:aws:iam::765932874577:policy/zoolanding-config-runtime-read-test-execution-boundary" \
              "LogLevel=INFO"
          else
            python3 .aws-sam/native-runtime-release.py --environment=test --execution="$EXECUTION" --release-root=.aws-sam/release --manifest-digest="$SEALED_MANIFEST_DIGEST" --source-sha="$GITHUB_SHA" --review-digest="$REVIEW_DIGEST" --review-change-set-arn="$REVIEW_CHANGE_SET_ARN"
          fi

      - name: Verify immutable live alias
        if: github.event_name == 'push' || inputs.execution == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          expected_code_sha256="$(tr -d '\r\n' < .aws-sam/release/lambda-code-sha256.txt)"
          function_name="$(aws cloudformation describe-stacks --stack-name zoolanding-config-runtime-read-test --query "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue | [0]" --output text --no-cli-pager)"
          [[ -n "$function_name" && "$function_name" != "None" ]]
          live_version="$(aws lambda get-alias --function-name "$function_name" --name live --query FunctionVersion --output text --no-cli-pager)"
          [[ "$live_version" =~ ^[1-9][0-9]*$ ]]
          deployed_code_sha256="$(aws lambda get-function-configuration --function-name "$function_name" --qualifier "$live_version" --query CodeSha256 --output text --no-cli-pager)"
          test "$deployed_code_sha256" = "$expected_code_sha256"
